<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classifica - Login Aluno</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="LoginAluno.js" defer></script>
<script type="module" src="../DataCepCpf.js" defer></script>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    display: flex;
    width: 100%;
    max-width: 1600px; /* Igual ao cadastro */
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    min-height: 90vh; /* Igual ao cadastro */
  }
  
  /* Painel Esquerdo (Exatamente igual ao cadastro) */
  .left {
    flex: 1;
    background: linear-gradient(160deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 30px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .circle {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
  }
  .circle.c1 { width: 130px; height: 130px; top: 40px; left: 30px; }
  .circle.c2 { width: 90px; height: 90px; top: 180px; right: 40px; }
  .circle.c3 { width: 160px; height: 160px; bottom: -40px; left: -40px; } /* Recuperado do cadastro */
  
  .badge {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    z-index: 1;
    position: relative;
  }
 
  .left h1 { font-size: 56px; margin-bottom: 40px; z-index: 1; }
  .left h2 { font-size: 32px; margin-bottom: 16px; z-index: 1; font-weight: 600; }
  .left p { font-size: 20px; opacity: 0.95; z-index: 1; line-height: 1.6; }

  /* Painel Direito (Com o espaçamento amplo do cadastro) */
  .right {
    flex: 1.2;
    padding: 60px 80px; /* Igual ao cadastro */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    width: 100%;
    max-width: 520px; /* Um pouco mais largo para harmonizar com a tela maior */
  }
  .right h2 { font-size: 36px; color: #2c3e50; margin-bottom: 6px; font-weight: 600; }
  .right .subtitle { color: #888; font-size: 16px; margin-bottom: 30px; }

  form label {
    display: block;
    font-size: 15px;
    color: #4a5568;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  form input {
    width: 100%;
    padding: 16px 18px; /* Igual ao cadastro */
    border: 1px solid #dfe3e8;
    border-radius: 8px;
    font-size: 16px;
    background: #f8f9fb;
    outline: none;
    transition: border-color .2s;
  }
  form input:focus { border-color: #3aa4e8; background: #fff; }
  
  .eye-icon {
    position: absolute;
    right: 18px;
    cursor: pointer;
    color: #a0aec0;
    display: flex;
    align-items: center;
  }

  .forgot-password {
    display: block;
    text-align: right;
    color: #3aa4e8;
    font-size: 14px;
    text-decoration: none;
    margin-top: 10px;
  }
  .forgot-password:hover { text-decoration: underline; }

  .btn-submit {
    width: 100%;
    padding: 16px 36px; /* Igual ao cadastro */
    border-radius: 8px;
    border: none;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 30px;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
    color: #fff;
    transition: transform .1s, opacity .2s;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: scale(0.98); }

  /* Divisor "ou" */
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #a0aec0;
    font-size: 15px;
    margin: 30px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #dfe3e8;
  }
  .divider:not(:empty)::before { margin-right: 1em; }
  .divider:not(:empty)::after { margin-left: 1em; }

  /* Botões Sociais */
  .social-buttons {
    display: flex;
    gap: 16px;
    margin-bottom: 30px;
  }
  .btn-social {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    border: 1px solid #dfe3e8;
    border-radius: 8px;
    background: #fff;
    font-size: 15px;
    font-weight: 600;
    color: #4a5568;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-social:hover { background: #f8f9fb; }

  /* Links de rodapé */
  .footer-links {
    text-align: center;
    font-size: 15px;
    color: #4a5568;
  }
  .footer-links a {
    color: #3aa4e8;
    text-decoration: none;
    font-weight: 600;
  }
  .footer-links a:hover { text-decoration: underline; }
  
  .prof-login {
    display: block;
    margin-top: 14px;
    color: #a0aec0;
    font-weight: 500;
  }

  @media (max-width: 850px) {
    .container { flex-direction: column; min-height: auto; }
    .circle { display: none; }
    .right { padding: 40px 30px; }
  }
  .senha-container{
      display: flex;
      align-items: center;
      gap: 10px;
  }

  .senha-container input{
      flex: 1;
  }

  .btn-cadeado{
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #718096;
      padding: 0;
  }

  .btn-cadeado:hover{
      color: #3aa4e8;
  }

  .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24;
      font-size: 24px;
  }
</style>
</head>
<body>

  <div class="container">
    <!-- Painel Esquerdo -->
    <div class="left">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
      <div class="badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1">
          <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
        </svg>
      </div>
      <h1>Classifica</h1>
      <h2>Bem-vindo ao Classifica</h2>
      <p>Sistema para o ingresso<br>ao Ensino Técnico Federal</p>
    </div>

    <!-- Painel Direito -->
    <div class="right">
      <div class="login-box">
        <h2>Login Aluno</h2>
        <p class="subtitle">Acesse sua conta para continuar</p>

        <form id="formLoginAluno">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>

        <label for="senha">Senha</label>
          <div class="senha-container">
            <input type="password" id="senha" placeholder="Sua senha">
              <button type="button" id="btn-cadeado" class="btn-cadeado">
              <span class="material-symbols-outlined">lock</span>
            </button>
          </div>
          
          <a href="#" class="forgot-password">Esqueceu a senha?</a>

          <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="divider">ou</div>

        <div class="social-buttons">
          <button type="button" class="btn-social" onclick="loginGoogle()">
              <svg width="18" height="18" viewBox="0 0 48 48">
                  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C33.9 6.1 29.2 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                  <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.7 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C33.9 6.1 29.2 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                  <path fill="#4CAF50" d="M24 44c5.1 0 9.8-2 13.3-5.2l-6.1-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.3-11.5-8l-6.5 5C9.2 39.5 16 44 24 44z"/>
                  <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6.1 7.1l6.1 5.2C39.2 36.7 44 31 44 24c0-1.3-.1-2.4-.4-3.5z"/>
              </svg>
              Entrar com Google
          </button>
      </div> 

        <div class="footer-links">
          <span>Não tem conta? <a href="../1CadastroAluno/CadastroAluno.html">Cadastre-se</a></span>
          <a href="../4LoginProfessor/LoginProfessor.html" class="prof-login">Login Professor</a>
        </div>
      </div>
    </div>
  </div
</body>
</html>
