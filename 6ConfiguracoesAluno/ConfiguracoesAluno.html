<!DOCTYPE html>
<html lang="pt-BR">
<head >
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configurações - Classifica</title>
<script type="module" src="ConfiguracoesAluno.js" defer></script>
<script type="module" src="../DataCepCpf.js" defer></script>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 90vh;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .brand h1 { font-size: 28px; font-weight: 700; }

  .nav { list-style: none; }
  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
  }
  .nav li:hover { background: rgba(255,255,255,0.12); }
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  /* Main content */
  .main {
    flex: 1;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
  }
  .main h2 {
    font-size: 36px;
    color: #2c3e50;
    margin-bottom: 12px;
  }
  .divider {
    height: 6px;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
    border-radius: 4px;
    margin-bottom: 40px;
  }

  /* Formulário de Configurações */
  .config-card {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .config-card h3 {
    font-size: 28px;
    color: #2c3e50;
    align-self: flex-start;
    font-weight: 500;
  }
  .config-card p {
    font-size: 14px;
    color: #a0aec0;
    align-self: flex-start;
    margin-top: 4px;
    margin-bottom: 30px;
  }

  /* Foto de perfil placeholder */
  .avatar-upload {
    width: 100px;
    height: 100px;
    border: 2px dashed #cbd5e0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #718096;
    cursor: pointer;
    margin-bottom: 40px;
    transition: border-color 0.2s;
  }
  .avatar-upload:hover {
    border-color: #3aa4e8;
    color: #3aa4e8;
  }

  /* Grid do Formulário */
  .form-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 40px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
  }
  .form-group.full-width {
    grid-column: span 2;
  }
  
  .form-group label {
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    padding: 14px 18px;
    background: #f7f9fc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-size: 16px;
    color: #2c3e50;
    outline: none;
    transition: all 0.2s;
  }
  .form-group input:focus {
    border-color: #3aa4e8;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(58, 164, 232, 0.1);
  }

  /* Botões de ação */
  .form-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: auto;
  }

  .btn-submit {
    padding: 15px 60px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: scale(0.98); }

  .btn-delete {
    padding: 15px 40px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    background: #f7f9fc;
    color: #718096;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-delete:hover {
    background: #fff5f5;
    color: #e53e3e;
    border-color: #fed7d7;
  }

  @media (max-width: 900px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; }
    .main { padding: 30px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full-width { grid-column: span 1; }
    .form-actions { flex-direction: column; }
    .btn-submit, .btn-delete { width: 100%; }
  }
  
.senha-container{
    display: flex;
    align-items: center;
    gap: 10px;
}

.senha-container input{
    flex: 1;
}

.btn-cadeado{
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #718096;
    padding: 0;
}

.btn-cadeado:hover{
    color: #3aa4e8;
}

.material-symbols-outlined {
    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
    font-size: 24px;
}
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Sala de Aula
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6M5 6h14v16H5z"/></svg>
            Meus Simulados
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Banco de Questões
          </li>
          <li class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
          </li>
        </ul>
      </div>

      <div class="user">
        <div class="avatar">L</div>
        <div class="info">
          <b id="nomeUsuario"></b>
          <span>Aluno(a)</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <h2>Configurações</h2>
      <div class="divider"></div>

      <div class="config-card">
        <h3>Configurações Aluno(a)</h3>
        <p>Preencha os campos para modificar seus dados</p>

        <div class="avatar-upload" title="Adicionar Foto">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome"/>
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf"/>
          </div>

          <div class="form-group ">
            <label for="nascimento">Data de Nascimento</label>
            <input type="text" id="nascimento" />
          </div>

          <div class="form-group full-width ">
            <label for="email">Email</label>
            <input type="email" id="email" />
          </div>

          <div class="form-group">
            <label for="endereco">CEP</label>
            <input type="text" id="cep" />
          </div>  

          <div class="form-group">
              <label for="senha">Senha</label>

              <div class="senha-container">
                  <input type="password" id="senha" readonly>

                  <button type="button" id="editarSenha" class="btn-cadeado">
                      <span class="material-symbols-outlined">
                          lock
                      </span>
                  </button>
              </div>
          </div>

        <div class="form-actions">
          <button type="button" class="btn-submit" id="modificar">Modificar</button>
          <button type="button" class="btn-delete" id="deletar">Excluir Usuário</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
