<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avaliação diagnóstica - Classifica</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 90vh;
  }

  .sidebar { /*Barra de navegação lateral esquerda*/
    width: 280px;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Logotipo e Nome da marca no topo da sidebar */
  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }

  .brand h1 { font-size: 28px; font-weight: 700; }/*classifica*/

  .nav { list-style: none; }/*nevegação*/

  /*intens do menu */
  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }

  .nav li:hover { background: rgba(255,255,255,0.12); } /*passar o mouse*/ 
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; } /*efeito ativo menu*/
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; } /*icones internos do menu*/

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  /*  alinha itens no topo como na tela de simulados */
  .main {
    flex: 1;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Alinha o conteúdo no topo, sem esticar */
  }

  /* Bloco do Card Principal - Mesmos paddings e sombras dos cards originais */
  .question-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 36px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    margin-bottom: 24px;
    width: 100%;
  }

  .question-header { /*numero da questao e da disciplina*/
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .question-title { /*titulo da questão*/
    font-size: 24px;
    color: #2c3e50;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 15px;
  }
 
  .progress-container { 
    width: 150px;
    height: 12px;
    background: #eef1f5;
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-bar {  /* Barra de Progresso */
    width: 35%; /*vai mudando de acordo com as questões*/
    height: 100%;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
  }

  .discipline-tag {
    font-size: 15px;
    font-weight: 600;
    color: #4a5568;
  }

  /* Caixa interna do enunciado */
  .enunciado-box {
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    padding: 24px;
    background: #fff;
    color: #4a5568;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .enunciado-box p {
    margin-bottom: 12px;
  }

  .enunciado-box ul {
    list-style: none;
    padding-left: 5px;
  }

  .enunciado-box ul li {
    margin-bottom: 6px;
  }

  /* Listagem de Alternativas */
  .alternatives-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .alternative-row { /* Linha individual de alternativa (Botões A, B, C, D) */
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
    color: #2c3e50;
    transition: background .2s, border-color .2s; /* Transição suave de cor ao interagir */
  }

  .alternative-row:hover {
    background: #f7f9fb;
  }

  .alternative-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #4a5568;
    margin-right: 16px;
    flex-shrink: 0;
  }

  /* Estado Selecionado (Alternativa D) */
  .alternative-row.selected {
    background: #e6f7f0;
    border-color: #3ec98a;
  }

  .alternative-row.selected .alternative-badge {
    background: #fff;
    color: #3ec98a;
    border: 1px solid #3ec98a;
  }

  /* Rodapé do Botão - Mesma estrutura de linha dos simulados */
  .action-row {
    display: flex;
    justify-content: flex-start;
    width: 100%;
  }

  .btn-submit {
    padding: 14px 40px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }

  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: scale(0.98); }

  @media (max-width: 900px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; }
    .main { padding: 30px; }
  }
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav"> <!--- lista lateral esquerda do menu -->
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Sala de Aula
          </li>
          <li class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6M5 6h14v16H5z"/></svg>
            Questões
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Desempenho
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
          </li>
        </ul>
      </div>

      <div class="user"> <!--- usuário--->
        <div class="avatar">L</div>
        <div class="info">
          <b>Letícia Pinho</b>
          <span>Estudante</span>
        </div>
      </div>
    </aside>

    <main class="main"> <!----->
        <div id="loading" style="text-align: center; padding: 50px; display: block;">
              Carregando questões...
            </div>

            <div class="questao" id="questao" style="display: none;">
              <!-- todo o conteúdo original permanece aqui -->
              <div class="cabecalho-questao"> ... </div>
        <div class="enunciado-box" id="enunciadoBox">...</div>
        <div class="alternatives-container" id="alternativesContainer">...</div>
      </div>
      <div class="questao" id="questao">
        <div class="cabecalho-questao">
          <div class="titulo-questao">
            <span id="questaoNumero">Questão 1 de 15</span>
            <div class="bloco-progresso">
              <div class="barra-progresso" id="barraProgresso"></div>
            </div>
          </div>
          <div class="tag-disciplina" id="tagDificuldade">Médio</div>
        </div>

        <div class="enunciado-box" id="enunciadoBox">
          <!-- Enunciado será inserido dinamicamente -->
        </div>

        <div class="alternatives-container" id="alternativesContainer">
          <!-- Alternativas serão inseridas dinamicamente -->
        </div>
      </div>

      <div class="action-row"> <!--botao de enviar respostas-->
        <button class="btn-enviar" id="btn-enviar" onclick="verificarResposta()"> <!--- função-->
          Confirmar respostas
        </button>
      </div>
    </main>
  </div>

  <script>
    // Estado da aplicação
    let questoes = []; //array
    let questaoAtual = 0; //contador de qual questão esta
    let alternativaSelecionada = null; //qual a resposta selecionada
    let respostas = []; // Array para armazenar respostas do aluno

    // Configuração da API
    const API_URL = 'http://localhost:3000/api'; //Node JS - colocar caminho do node

    // Função para carregar questões do banco de dados
    // função que permite outras funções simultaneamente
      async function carregarQuestoes() {
      try {
        // Mostra loading, esconde a questão
        document.getElementById('loading').style.display = 'block';
        document.getElementById('questao').style.display = 'none';

        const response = await fetch(`${API_URL}/questoes?limite=15`);
        if (!response.ok) throw new Error('Erro ao carregar questões');

        questoes = await response.json();
        console.log('Questões recebidas:', questoes);
        questaoAtual = 0;
        respostas = new Array(questoes.length).fill(null);

        // Oculta loading, mostra a questão
        document.getElementById('loading').style.display = 'none';
        document.getElementById('questao').style.display = 'block';

        if (questoes.length > 0) {
          renderizarQuestao();
        } else {
          document.getElementById('enunciadoBox').innerHTML = 
            '<p style="text-align:center;">Nenhuma questão disponível</p>';
          document.getElementById('alternativesContainer').innerHTML = '';
        }
      } catch (error) {
        console.error('Erro:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('questao').style.display = 'block';
        document.getElementById('enunciadoBox').innerHTML = 
          '<p style="color:red; text-align:center;">Erro ao carregar questões</p>';
      }
    }
  
    // Função para renderizar a questão atual
    function renderizarQuestao() {
      if (questaoAtual >= questoes.length) { // quando todas as questões acabarem
        mostrarResultadoFinal(); // mostra o array dos resultados
        return;
      }

      const questao = questoes[questaoAtual]; //pega o indice da questao atual e passa para essa variavel
      
      // Atualizar número da questão e progresso
      document.getElementById('questaoNumero').textContent = // pega o conteúdo do h1 pelo id e define o que tem dentro 
        `Questão ${questaoAtual + 1} de ${questoes.length}`; // pega  o indice da questão atual e o tanto de questões existentes 
      
      const progresso = ((questaoAtual + 1) / questoes.length) * 100; //  porcentagem de progresso
      document.getElementById('barraProgresso').style.width = `${progresso}%`; // atualiza a largura da barra de progresso

      // Renderizar enunciado
      const enunciadoBox = document.getElementById('enunciadoBox'); // pega o conteúdo html pelo id 
      enunciadoBox.innerHTML = `<p>${questao.enunciado}</p>`; // insere o enunciado da questão pela api do bd 

      // Renderizar alternativas
      const alternativesContainer = document.getElementById('alternativesContainer'); // pega o conteúdo html pelo id 
      const alternativas = ['a', 'b', 'c', 'd']; // define as alternativas
      const letras = ['A', 'B', 'C', 'D']; // define as letras das alternativas
      
      alternativesContainer.innerHTML = alternativas.map((alt, index) => { // pega a variavel e percorre o array de alternativas
        const isSelected = alternativaSelecionada === alt; // verifica se a alternativa atual é a que o usuario escolheu 
        // se tiver selecionado, adiciona a classe selected para mudar a cor
        // chama a função selecionarAlternativa quando o usuario clicar na alternativa 
        return `
          <div class="alternative-row ${isSelected ? 'selected' : ''}" 
               onclick="selecionarAlternativa('${alt}', this)"> 
            <div class="alternative-badge">${letras[index]}</div> // coloca a letra da alternativa na frente
            ${questao[`alternativa_${alt}`]} // insere o texto da alternativa
          </div>
        `;
      }).join(''); // mapazinho para montar o layout das alternativas

      // Restaurar seleção anterior se existir
      if (respostas[questaoAtual]) { // pega o array de respostas e o indice é o contador (se ele existir, significa que o usuario ja respondeu aquela questão)
        alternativaSelecionada = respostas[questaoAtual]; // armazena a resposta na variavel
        const selectedRow = document.querySelector(`[onclick*="${alternativaSelecionada}"]`); // seleciona a linha da alternativa
        if (selectedRow) { // se tiver selecionado
          selectedRow.classList.add('selected'); // adiciona a classe selected
        }
      } else { // se não tiver selecionado
        alternativaSelecionada = null; // reseta a variavel
      }

      // Atualizar botão
      document.getElementById('btn-enviar').textContent = 
        questaoAtual === questoes.length - 1 ? 'Finalizar avaliação' : 'Próxima questão';
    }

    // Função para selecionar alternativa
    function selecionarAlternativa(letra, element) {
      // Remover seleção anterior
      const rows = document.querySelectorAll('.alternative-row');
      rows.forEach(row => row.classList.remove('selected'));
      
      // Adicionar seleção atual
      element.classList.add('selected');
      alternativaSelecionada = letra;
      
      // Salvar resposta
      respostas[questaoAtual] = letra;
    }

    // Função para verificar resposta e avançar
    async function verificarResposta() {
      if (!alternativaSelecionada) {
        alert('Por favor, selecione uma alternativa antes de continuar.');
        return;
      }

      const questao = questoes[questaoAtual];

      try {
        // Verificar resposta no backend
        const response = await fetch(`${API_URL}/verificar-resposta`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            questaoId: questao.id,
            respostaAluno: alternativaSelecionada
          })
        });

        if (!response.ok) {
          throw new Error('Erro ao verificar resposta');
        }

        const resultado = await response.json();

        // Mostrar feedback
        mostrarFeedback(resultado);

        // Aguardar um momento antes de avançar
        setTimeout(() => {
          questaoAtual++;
          alternativaSelecionada = null;
          
          if (questaoAtual < questoes.length) {
            renderizarQuestao();
            // Remover feedback
            document.getElementById('feedbackContainer')?.remove();
          } else {
            mostrarResultadoFinal();
          }
        }, 1500);

      } catch (error) {
        console.error('Erro:', error);
        // Fallback: verificação local
        const alternativaCorreta = questao.alternativa_correta.toLowerCase();
        const acertou = alternativaSelecionada === alternativaCorreta;
        
        mostrarFeedback({
          acertou,
          alternativaCorreta: questao.alternativa_correta.toUpperCase(),
          mensagem: acertou ? 'Resposta correta!' : 'Resposta incorreta!'
        });

        setTimeout(() => {
          questaoAtual++;
          alternativaSelecionada = null;
          
          if (questaoAtual < questoes.length) {
            renderizarQuestao();
            document.getElementById('feedbackContainer')?.remove();
          } else {
            mostrarResultadoFinal();
          }
        }, 1500);
      }
    }

    // Função para mostrar feedback visual
    function mostrarFeedback(resultado) {
      // Remover feedback anterior se existir
      document.getElementById('feedbackContainer')?.remove();

      const feedbackDiv = document.createElement('div');
      feedbackDiv.id = 'feedbackContainer';
      feedbackDiv.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 25px;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
      `;

      if (resultado.acertou) {
        feedbackDiv.style.backgroundColor = '#4CAF50';
        feedbackDiv.textContent = '✓ Resposta Correta!';
      } else {
        feedbackDiv.style.backgroundColor = '#f44336';
        feedbackDiv.textContent = `✗ Resposta Incorreta! A correta era: ${resultado.alternativaCorreta}`;
      }

      document.body.appendChild(feedbackDiv);

      // Adicionar animação CSS
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideIn {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(100%); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    // Função para mostrar resultado final
    async function mostrarResultadoFinal() {
      const totalQuestoes = questoes.length; // pega o tamanho do array de questoes
      let acertos = 0; // inicialmente é 0

      // Calcular acertos (verificação local para o resumo)
      for (let i = 0; i < questoes.length; i++) { // vai passando pelo array 
        if (respostas[i] && respostas[i].toLowerCase() === questoes[i].alternativa_correta.toLowerCase()) {// lowercase só converte para letra minuscula para nao dar erro 
          acertos++; //se a opcao etiver equivalente soma um
        }
      }

      const porcentagem = Math.round((acertos / totalQuestoes) * 100);
      
      document.getElementById('questionCard').innerHTML = `
        <div style="text-align: center; padding: 50px;">
          <h2 style="color: #2c3e50; margin-bottom: 20px;">Avaliação Concluída!</h2>
          <div style="font-size: 48px; font-weight: bold; color: #3aa4e8; margin-bottom: 20px;">
            ${porcentagem}%
          </div>
          <p style="font-size: 18px; color: #4a5568; margin-bottom: 10px;">
            Você acertou ${acertos} de ${totalQuestoes} questões
          </p>
          <button onclick="reiniciarAvaliacao()" 
                  style="margin-top: 20px; padding: 14px 40px; border-radius: 30px; border: none; 
                         background: linear-gradient(90deg, #3aa4e8, #3ec98a); color: white; 
                         font-size: 17px; font-weight: 600; cursor: pointer;">
            Nova Avaliação
          </button>
        </div>
      `;

      document.getElementById('btn-enviar').style.display = 'none';
    }

    // Função para reiniciar avaliação
    function reiniciarAvaliacao() {
      document.getElementById('btn-enviar').style.display = 'block';
      document.getElementById('btn-enviar').textContent = 'Confirmar respostas';
      carregarQuestoes();
    }

    // Inicializar quando a página carregar
    document.addEventListener('DOMContentLoaded', () => {
      carregarQuestoes();
      
      // Atualizar evento do botão
      document.getElementById('btn-enviar').onclick = verificarResposta;
    });

    // Atalho de teclado para selecionar alternativas
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['a', 'b', 'c', 'd'].includes(key)) {
        const index = ['a', 'b', 'c', 'd'].indexOf(key);
        const rows = document.querySelectorAll('.alternative-row');
        if (rows[index]) {
          selecionarAlternativa(key, rows[index]);
        }
      } else if (e.key === 'Enter') {
        verificarResposta();
      }
    });
  </script>
</body>
</html>
