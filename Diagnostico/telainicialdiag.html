<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Início Diagnóstico - Classifica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f1e7; /* bege claro */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      padding: 60px;
      max-width: 800px;
      text-align: center;
    }

    .panel h1 {
      color: #2f3640;
      font-size: 28px;
      margin-bottom: 25px;
    }

    .panel p {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 40px;
    }

    .btn {
      background: linear-gradient(90deg, #0097e6, #00cec9);
      color: #fff;
      border: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Seja bem-vindo ao Classifica!</h1>
    <p>
      Nossa plataforma te acompanhará durante toda essa jornada. 
      Para começar, precisamos que você resolva algumas questões diagnósticas 
      para identificarmos suas habilidades e suas dificuldades.
    </p>
    <button class="btn" onclick="window.location.href='diagnostico.html'">
      Iniciar Diagnóstico
    </button>
  </div>~
 <script>
document.addEventListener('DOMContentLoaded', async () => {
  const idEstudante = localStorage.getItem('idEstudante');

  if (!idEstudante) {
    window.location.href = '../2LoginAluno/LoginAluno.html';
    return;
  }

  try {
    const response = await fetch(`http://localhost:3000/api/diagnostico/status/${idEstudante}`);

    if (!response.ok) {
      const texto = await response.text();
      throw new Error(texto || 'Erro ao verificar');
    }

    const data = await response.json();

    if (data.jaFez) {
      window.location.href = '../6ConfiguracoesAluno/ConfiguracoesAluno.html';
    }
  } catch (erro) {
    console.error('Erro ao verificar diagnóstico:', erro);
    alert('Erro ao verificar seu progresso. Tente novamente.');
  }
});
</script>
</body>
</html>
