<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho - Classifica</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fc;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid #e9edf4;
        }

        .sidebar .logo {
            font-size: 24px;
            font-weight: 700;
            color: #2d3b4e;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .sidebar .logo span {
            color: #4a7cf7;
        }

        .sidebar a {
            text-decoration: none;
            color: #5a6b7c;
            font-size: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .sidebar a:hover {
            background: #eef3fc;
            color: #1f2a3a;
        }
        .sidebar a.active {
            background: #4a7cf7;
            color: #fff;
            box-shadow: 0 4px 10px rgba(74, 124, 247, 0.3);
        }
        .sidebar a i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .main {
            flex: 1;
            padding: 40px 50px;
            max-width: calc(100% - 230px);
        }

        .main h1 {
            font-size: 28px;
            color: #1f2a3a;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .card-geral {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border: 1px solid #eef2f8;
        }

        .card-geral .info {
            display: flex;
            flex-direction: column;
        }
        .card-geral .info h2 {
            font-size: 18px;
            font-weight: 500;
            color: #6b7d90;
            letter-spacing: 0.5px;
        }
        .card-geral .info .taxa {
            font-size: 52px;
            font-weight: 700;
            color: #1f2a3a;
            margin-top: 4px;
        }
        .card-geral .info .taxa span {
            font-size: 28px;
            font-weight: 400;
            color: #8a9aa8;
        }
        .card-geral .classificacao {
            background: #e6f0ff;
            color: #4a7cf7;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-geral .parabens {
            margin-top: 8px;
            font-size: 15px;
            color: #5a6b7c;
        }

        .grid-areas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card-area {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #eef2f8;
            transition: transform 0.2s;
        }
        .card-area:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .card-area h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2a3a;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .card-area .item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 15px;
            color: #3d4d5e;
            border-bottom: 1px solid #f0f4fa;
        }
        .card-area .item:last-child {
            border-bottom: none;
        }
        .card-area .item .label {
            font-weight: 400;
            color: #6b7d90;
        }
        .card-area .item .valor {
            font-weight: 600;
            color: #1f2a3a;
        }

        .card-area .taxa-destaque {
            font-size: 28px;
            font-weight: 700;
            color: #4a7cf7;
            margin: 8px 0 12px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7d90;
            font-size: 18px;
        }
        .loading i {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
            color: #4a7cf7;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }
            .sidebar .logo {
                font-size: 18px;
                text-align: center;
            }
            .sidebar a span {
                display: none;
            }
            .main {
                padding: 20px;
                max-width: 100%;
            }
            .card-geral {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .grid-areas {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Classi<span>fica</span></div>
        <a href="#"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
        <a href="#"><i class="fas fa-users"></i> <span>Sala de Aula</span></a>
        <a href="#"><i class="fas fa-question-circle"></i> <span>Questões</span></a>
        <a href="#" class="active"><i class="fas fa-chart-line"></i> <span>Desempenho</span></a>
        <a href="#"><i class="fas fa-cog"></i> <span>Configurações</span></a>
    </aside>

    <main class="main">
        <h1>Desempenho</h1>

        <div class="card-geral" id="cardGeral">
            <div class="info">
                <h2>ÍNDICE GERAL DE DESEMPENHO</h2>
                <div class="taxa" id="taxaGeral">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        Carregando...
                    </div>
                </div>
                <div class="parabens" id="mensagemParabens">Aguarde...</div>
            </div>
            <div class="classificacao" id="classificacaoGeral">--</div>
        </div>

        <div class="grid-areas" id="gridAreas">
            <div class="loading" style="grid-column: 1/-1;">
                <i class="fas fa-spinner fa-spin"></i>
                Carregando dados...
            </div>
        </div>
    </main>

    <script>
        // ===== CONFIGURAÇÃO =====
        const API_URL = 'http://localhost:3000';

        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página de desempenho carregada');
            
            // ===== CORREÇÃO: Usar a mesma chave do login =====
            // O login salva como "idEstudante" (com E maiúsculo)
            const idEstudante = localStorage.getItem('idEstudante');
            
            console.log('ID do Estudante (do localStorage):', idEstudante);
            
            // Mostra todos os dados do localStorage para debug
            console.log('Todos os dados do localStorage:', localStorage);

            if (!idEstudante || idEstudante === 'undefined' || idEstudante === 'null') {
                mostrarErro('Faça login para ver seu desempenho.');
                return;
            }

            // Faz a requisição para o backend
            const url = API_URL + '/api/desempenho/' + idEstudante;
            console.log('URL da requisição:', url);

            fetch(url)
                .then(function(res) {
                    console.log('Status da resposta:', res.status);
                    if (!res.ok) {
                        throw new Error('Erro HTTP: ' + res.status);
                    }
                    return res.json();
                })
                .then(function(data) {
                    console.log('Dados recebidos:', data);
                    preencherDados(data);
                })
                .catch(function(err) {
                    console.error('Erro detalhado:', err);
                    mostrarErro('Erro ao carregar os dados. Verifique se o servidor está rodando.');
                });
        });

        function preencherDados(data) {
            var geral = data.geral;
            var areas = data.areas;
            
            document.getElementById('taxaGeral').innerHTML = geral.taxa + '<span>%</span>';
            document.getElementById('classificacaoGeral').textContent = geral.classificacao;
            
            var mensagem = 'Que tal revisar os conteúdos? Você pode melhorar!';
            if (geral.taxa >= 80) {
                mensagem = 'Parabéns! Você está acima da média e mantendo seu desempenho.';
            } else if (geral.taxa >= 60) {
                mensagem = 'Bom desempenho! Continue praticando para melhorar.';
            }
            document.getElementById('mensagemParabens').textContent = mensagem;
            
            var grid = document.getElementById('gridAreas');
            grid.innerHTML = '';
            
            if (!areas || areas.length === 0) {
                grid.innerHTML = 
                    '<p style="grid-column: 1/-1; color: #6b7d90; text-align: center; padding: 40px;">' +
                    'Nenhuma questão respondida no diagnóstico. Faça o diagnóstico para ver seu desempenho.</p>';
                return;
            }
            
            areas.forEach(function(area) {
                var card = document.createElement('div');
                card.className = 'card-area';
                card.innerHTML = `
                    <h3>${area.nome}</h3>
                    <div class="taxa-destaque">${area.taxa}%</div>
                    <div class="item">
                        <span class="label">TAXA DE ACERTO</span>
                        <span class="valor">${area.taxa}%</span>
                    </div>
                    <div class="item">
                        <span class="label">QUESTÕES RESPONDIDAS</span>
                        <span class="valor">${area.respondidas}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function mostrarErro(mensagem) {
            document.getElementById('taxaGeral').innerHTML = '--<span>%</span>';
            document.getElementById('mensagemParabens').textContent = mensagem;
            document.getElementById('classificacaoGeral').textContent = 'Erro';
            document.getElementById('gridAreas').innerHTML = 
                '<p style="grid-column: 1/-1; color: #d32f2f; text-align: center; padding: 40px;">' +
                mensagem + '</p>';
        }
    </script>
</body>
</html>
