<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulado - Classifica</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 90vh;
  }

  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }

  .brand h1 { font-size: 28px; font-weight: 700; }

  .nav { list-style: none; }

  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }

  .nav li:hover { background: rgba(255,255,255,0.12); }
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  .main {
    flex: 1;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .main-header { margin-bottom: 24px; }
  .main-header h2 { font-size: 26px; color: #2c3e50; }
  .main-header p { font-size: 15px; color: #4a5568; margin-top: 4px; }

  .question-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 36px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    margin-bottom: 24px;
    width: 100%;
  }

  .question-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .question-title {
    font-size: 24px;
    color: #2c3e50;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .progress-container {
    width: 150px;
    height: 12px;
    background: #eef1f5;
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: #3aa4e8;
    transition: width 0.3s ease;
  }

  .enunciado-box {
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    padding: 24px;
    background: #fff;
    color: #4a5568;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .enunciado-box p { margin-bottom: 12px; }

  .alternatives-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .alternative-row {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
    color: #2c3e50;
    transition: background .2s, border-color .2s;
  }

  .alternative-row:hover { background: #f7f9fb; }

  .alternative-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #4a5568;
    margin-right: 16px;
    flex-shrink: 0;
  }

  .alternative-row.selected {
    background: #e6f7f0;
    border-color: #3ec98a;
  }

  .alternative-row.selected .alternative-badge {
    background: #fff;
    color: #3ec98a;
    border: 1px solid #3ec98a;
  }

  /* Modo revisão (aluno já respondeu) */
  .alternative-row.revisao { cursor: default; }
  .alternative-row.marcada-certa {
    background: #e6f7f0;
    border-color: #3ec98a;
  }
  .alternative-row.marcada-certa .alternative-badge {
    background: #3ec98a; color: #fff; border: none;
  }
  .alternative-row.marcada-errada {
    background: #fdeceb;
    border-color: #f44336;
  }
  .alternative-row.marcada-errada .alternative-badge {
    background: #f44336; color: #fff; border: none;
  }
  .alternative-row.resposta-certa-nao-marcada {
    border-color: #3ec98a;
  }

  .revisao-tag {
    display: inline-block;
    margin-left: 10px;
    font-size: 13px;
    font-weight: 700;
  }
  .revisao-tag.certa { color: #3ec98a; }
  .revisao-tag.errada { color: #f44336; }

  .resultado-topo {
    text-align: center;
    padding: 30px 20px 10px;
  }
  .resultado-topo .pct {
    font-size: 44px;
    font-weight: bold;
    color: #3aa4e8;
  }
  .resultado-topo p {
    font-size: 16px;
    color: #4a5568;
    margin-top: 6px;
  }

  .action-row {
    display: flex;
    justify-content: flex-start;
    width: 100%;
    gap: 12px;
  }

  .btn-submit {
    padding: 14px 40px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, #3aa4e8, #3ec98a);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }

  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: scale(0.98); }

  .btn-voltar {
    padding: 14px 40px;
    border-radius: 30px;
    border: 1px solid #3aa4e8;
    background: #fff;
    color: #3aa4e8;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  @media (max-width: 900px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; }
    .main { padding: 30px; }
  }

  #loading { text-align: center; padding: 50px; display: block; }
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </li>
          <li>
            <a href="../Sala_de_Aula_Aluno/Sala_de_Aula.html"
              style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Sala de Aula
            </a>
          </li>
          <li class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6M5 6h14v16H5z"/></svg>
            Simulados
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Desempenho
          </li>
          <li>
            <a href="../6ConfiguracoesAluno/ConfiguracoesAluno.html"
              style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Configurações
            </a>
          </li>
        </ul>
      </div>

      <div class="user">
        <div class="avatar">L</div>
        <div class="info">
          <b id="nomeUsuario"></b>
          <span>Estudante</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <h2 id="simuladoTitulo">Simulado</h2>
        <p id="simuladoSubtitulo">Responda todas as questões abaixo</p>
      </div>

      <div id="loading">
        Carregando...
      </div>

      <div id="conteudo" style="display:none;">
        <!-- Modo responder: uma questão por vez -->
        <div class="question-card" id="questionCard" style="display: none;">
          <div class="question-header">
            <div class="question-title">
              <span id="questaoNumero">Questão 1 de 15</span>
            </div>
            <div class="progress-container">
              <div class="progress-bar" id="barraProgresso"></div>
            </div>
          </div>

          <div class="enunciado-box" id="enunciadoBox"></div>

          <div class="alternatives-container" id="alternativesContainer"></div>
        </div>

        <!-- Modo revisão: todas as questões já respondidas -->
        <div id="revisaoContainer"></div>

        <div class="action-row">
          <button class="btn-submit" id="btn-enviar">Confirmar respostas</button>
          <button class="btn-voltar" id="btn-voltar">Voltar para Sala de Aula</button>
        </div>
      </div>
    </main>
  </div>

  <script>
// ===================== Estado da aplicação =====================
let questoes = [];
let questaoAtual = 0;
let alternativaSelecionada = null;
let respostas = [];
let idEstudante = null;
let nomeEstudante = '';
let idSimulado = null;

const BASE_URL = 'http://localhost:3000';
const API_URL = `${BASE_URL}/api`;

function obterIdSimuladoDaURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
}

// ===================== Carregar dados do aluno =====================
async function carregarDadosAluno() {
    idEstudante = localStorage.getItem('idEstudante');
    if (!idEstudante || idEstudante === 'undefined') {
        alert('Você não está logado. Faça login novamente.');
        window.location.href = '../2LoginAluno/LoginAluno.html';
        return false;
    }

    try {
        const response = await fetch(`${BASE_URL}/estudante/${idEstudante}`);
        if (!response.ok) throw new Error('Erro ao buscar dados do aluno');
        const dados = await response.json();
        nomeEstudante = dados.nome || 'Aluno';
        document.getElementById('nomeUsuario').textContent = nomeEstudante;
        return true;
    } catch (error) {
        console.error('Erro ao carregar nome do aluno:', error);
        document.getElementById('nomeUsuario').textContent = 'Aluno';
        return true;
    }
}

// ===================== Checar se o aluno já respondeu esse simulado =====================
async function verificarStatusSimulado() {
    const response = await fetch(`${API_URL}/simulado/status/${idEstudante}/${idSimulado}`);
    if (!response.ok) throw new Error('Erro ao verificar status do simulado');
    const data = await response.json();
    return data.jaFez;
}

// ===================== Carregar questões (modo responder) =====================
async function carregarQuestoes() {
    const response = await fetch(`${BASE_URL}/listarQuestoesSimulado/${idSimulado}`);
    if (!response.ok) throw new Error('Erro ao carregar questões do simulado');

    questoes = await response.json();
    questaoAtual = 0;
    respostas = new Array(questoes.length).fill(null);

    document.getElementById('questionCard').style.display = 'block';

    if (questoes.length > 0) {
        renderizarQuestao();
    } else {
        document.getElementById('enunciadoBox').innerHTML =
            '<p style="text-align:center;">Nenhuma questão disponível neste simulado</p>';
        document.getElementById('alternativesContainer').innerHTML = '';
        document.getElementById('btn-enviar').style.display = 'none';
    }
}

function renderizarQuestao() {
    if (questaoAtual >= questoes.length) {
        mostrarResultadoFinal();
        return;
    }

    const questao = questoes[questaoAtual];

    document.getElementById('questaoNumero').textContent =
        `Questão ${questaoAtual + 1} de ${questoes.length}`;

    const progresso = ((questaoAtual + 1) / questoes.length) * 100;
    document.getElementById('barraProgresso').style.width = `${progresso}%`;

    document.getElementById('enunciadoBox').innerHTML = `<p>${questao.enunciado}</p>`;

    const alternativas = ['a', 'b', 'c', 'd'];
    const letras = ['A', 'B', 'C', 'D'];

    document.getElementById('alternativesContainer').innerHTML = alternativas.map((alt, index) => {
        const isSelected = (respostas[questaoAtual] === alt);
        return `
            <div class="alternative-row ${isSelected ? 'selected' : ''}"
                 onclick="selecionarAlternativa('${alt}', this)">
                <div class="alternative-badge">${letras[index]}</div>
                ${questao[`alternativa_${alt}`]}
            </div>
        `;
    }).join('');

    alternativaSelecionada = respostas[questaoAtual] || null;

    document.getElementById('btn-enviar').textContent =
        questaoAtual === questoes.length - 1 ? 'Finalizar simulado' : 'Próxima questão';
}

function selecionarAlternativa(letra, element) {
    document.querySelectorAll('.alternative-row').forEach(row => row.classList.remove('selected'));
    element.classList.add('selected');
    alternativaSelecionada = letra;
    respostas[questaoAtual] = letra;
}

function verificarResposta() {
    if (!alternativaSelecionada) {
        alert('Por favor, selecione uma alternativa antes de continuar.');
        return;
    }

    const questao = questoes[questaoAtual];
    const alternativaCorreta = questao.alternativa_correta.toLowerCase();
    const acertou = alternativaSelecionada === alternativaCorreta;

    respostas[questaoAtual] = alternativaSelecionada;

    mostrarFeedback({ acertou, alternativaCorreta: questao.alternativa_correta.toUpperCase() });

    setTimeout(() => {
        questaoAtual++;
        alternativaSelecionada = null;
        document.getElementById('feedbackContainer')?.remove();

        if (questaoAtual < questoes.length) {
            renderizarQuestao();
        } else {
            mostrarResultadoFinal();
        }
    }, 1500);
}

function mostrarFeedback(resultado) {
    document.getElementById('feedbackContainer')?.remove();

    const feedbackDiv = document.createElement('div');
    feedbackDiv.id = 'feedbackContainer';
    feedbackDiv.style.cssText = `
        position: fixed; top: 20px; right: 20px; padding: 15px 25px;
        border-radius: 8px; color: white; font-weight: bold; z-index: 1000;
        animation: slideIn 0.3s ease-out;
    `;

    if (resultado.acertou) {
        feedbackDiv.style.backgroundColor = '#4CAF50';
        feedbackDiv.textContent = '✓ Resposta Correta!';
    } else {
        feedbackDiv.style.backgroundColor = '#f44336';
        feedbackDiv.textContent = `✗ Resposta Incorreta! A correta era: ${resultado.alternativaCorreta}`;
    }

    document.body.appendChild(feedbackDiv);

    if (!document.getElementById('feedbackStyle')) {
        const style = document.createElement('style');
        style.id = 'feedbackStyle';
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    }
}

async function enviarRespostas() {
    const dadosParaEnvio = questoes.map((q, index) => ({
        id_exercicio: q.id,
        resposta: respostas[index] || null
    }));

    try {
        const response = await fetch(`${API_URL}/simulado/respostas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id_estudante: idEstudante,
                id_simulado: idSimulado,
                respostas: dadosParaEnvio
            })
        });

        if (!response.ok) throw new Error(await response.text());
        console.log('Respostas do simulado enviadas com sucesso');
    } catch (error) {
        console.error('Erro ao enviar respostas do simulado:', error);
        alert('Erro ao salvar suas respostas. Tente novamente mais tarde.');
    }
}

async function mostrarResultadoFinal() {
    const totalQuestoes = questoes.length;
    let acertos = 0;
    for (let i = 0; i < questoes.length; i++) {
        const resp = respostas[i];
        if (resp && resp.toLowerCase() === questoes[i].alternativa_correta.toLowerCase()) acertos++;
    }
    const porcentagem = totalQuestoes > 0 ? Math.round((acertos / totalQuestoes) * 100) : 0;

    document.getElementById('questionCard').innerHTML = `
        <div class="resultado-topo">
            <h2 style="color:#2c3e50; margin-bottom: 10px;">Simulado Concluído!</h2>
            <div class="pct">${porcentagem}%</div>
            <p>Você acertou ${acertos} de ${totalQuestoes} questões</p>
        </div>
    `;

    document.getElementById('btn-enviar').style.display = 'none';

    await enviarRespostas();

    const btnVoltar = document.getElementById('btn-voltar');
    btnVoltar.style.display = 'inline-block';
    btnVoltar.onclick = () => window.location.href = '../Sala_de_Aula_Aluno/Sala_de_Aula.html';
}

// ===================== Modo revisão (aluno já respondeu antes) =====================
async function carregarRevisao() {
    const response = await fetch(`${API_URL}/simulado/minhasRespostas/${idEstudante}/${idSimulado}`);
    if (!response.ok) throw new Error('Erro ao carregar suas respostas do simulado');
    const dados = await response.json();

    document.getElementById('simuladoSubtitulo').textContent = 'Você já respondeu este simulado. Confira abaixo suas respostas.';

    const totalQuestoes = dados.length;
    const acertos = dados.filter(q => q.correto).length;
    const porcentagem = totalQuestoes > 0 ? Math.round((acertos / totalQuestoes) * 100) : 0;

    const alternativas = ['a', 'b', 'c', 'd'];
    const letras = ['A', 'B', 'C', 'D'];

    let html = `
        <div class="question-card">
            <div class="resultado-topo">
                <div class="pct">${porcentagem}%</div>
                <p>Você acertou ${acertos} de ${totalQuestoes} questões</p>
            </div>
        </div>
    `;

    dados.forEach((questao, i) => {
        const respostaAluno = (questao.resposta_marcada || '').toLowerCase();
        const correta = (questao.alternativa_correta || '').toLowerCase();

        const alternativasHtml = alternativas.map((alt, index) => {
            let classe = '';
            let tag = '';
            if (alt === respostaAluno && questao.correto) {
                classe = 'marcada-certa';
                tag = '<span class="revisao-tag certa">Sua resposta ✓</span>';
            } else if (alt === respostaAluno && !questao.correto) {
                classe = 'marcada-errada';
                tag = '<span class="revisao-tag errada">Sua resposta ✗</span>';
            } else if (alt === correta) {
                classe = 'resposta-certa-nao-marcada';
                tag = '<span class="revisao-tag certa">Resposta correta</span>';
            }

            return `
                <div class="alternative-row revisao ${classe}">
                    <div class="alternative-badge">${letras[index]}</div>
                    ${questao[`alternativa_${alt}`]}
                    ${tag}
                </div>
            `;
        }).join('');

        html += `
            <div class="question-card">
                <div class="question-header">
                    <div class="question-title">Questão ${i + 1} de ${totalQuestoes}</div>
                </div>
                <div class="enunciado-box"><p>${questao.enunciado}</p></div>
                <div class="alternatives-container">${alternativasHtml}</div>
            </div>
        `;
    });

    document.getElementById('revisaoContainer').innerHTML = html;
    document.getElementById('btn-enviar').style.display = 'none';

    const btnVoltar = document.getElementById('btn-voltar');
    btnVoltar.style.display = 'inline-block';
    btnVoltar.onclick = () => window.location.href = '../Sala_de_Aula_Aluno/Sala_de_Aula.html';
}

// ===================== Inicialização =====================
document.addEventListener('DOMContentLoaded', async () => {
    const idEstudanteLocal = localStorage.getItem('idEstudante');
    if (!idEstudanteLocal || idEstudanteLocal === 'undefined') {
        window.location.href = '../2LoginAluno/LoginAluno.html';
        return;
    }

    idSimulado = obterIdSimuladoDaURL();
    if (!idSimulado) {
        document.getElementById('loading').innerHTML =
            '<p style="color:red;">Simulado não informado na URL. Volte e selecione um simulado.</p>';
        return;
    }

    const ok = await carregarDadosAluno();
    if (!ok) return;

    try {
        const jaFez = await verificarStatusSimulado();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';

        if (jaFez) {
            await carregarRevisao();
        } else {
            await carregarQuestoes();
            document.getElementById('btn-enviar').onclick = verificarResposta;
        }
    } catch (error) {
        console.error('Erro:', error);
        document.getElementById('loading').innerHTML =
            '<p style="color:red; text-align:center;">Erro ao carregar o simulado</p>';
    }
});
  </script>

</body>
</html>
