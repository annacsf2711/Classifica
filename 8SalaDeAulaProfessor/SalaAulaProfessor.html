<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Turma - Classifica</title>
<script type="module" src="SalaAulaProfessor.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 90vh;
  }
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .brand h1 { font-size: 28px; font-weight: 700; }

  .nav { list-style: none; }
  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }
  .nav li a {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; width: 100%;
  }
  .nav li:hover { background: rgba(255,255,255,0.12); }
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  .main {
    flex: 1;
    padding: 60px 70px;
    overflow-y: auto;
  }

  .voltar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
    text-decoration: none;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .voltar:hover { color: #2c3e50; }
  .voltar svg { width: 18px; height: 18px; }

  .turma-header {
    background: #fff;
    border-radius: 20px;
    padding: 28px 34px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .turma-header h2 {
    font-size: 28px;
    color: #2c3e50;
    margin-bottom: 8px;
  }
  .turma-header .meta {
    display: flex;
    gap: 20px;
    color: #4a5568;
    font-size: 15px;
    flex-wrap: wrap;
  }
  .turma-header .meta span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; background: #3ec98a; border-radius: 50%; }

  .codigo-pill {
    background: #e7ecff;
    color: #4a5cff;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 20px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  h2.section-title {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px;
    color: #2c3e50;
  }

  .colegas-panel {
    background: #ffffff;
    border-radius: 18px;
    padding: 28px 30px;
    box-shadow: 0 4px 18px rgba(20, 30, 60, 0.06);
  }

  .colegas-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px 18px;
    margin-top: 4px;
  }

  .colega-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }

  .colega-avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #eef1f6;
    color: #3aa4e8;
    font-weight: 700;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .colega-name {
    font-size: 13px;
    font-weight: 600;
    color: #1f2733;
  }

  .estado-vazio-alunos {
    text-align: center;
    padding: 40px 10px;
    color: #7c8698;
  }

  .btn-fechar {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
  }
  .btn-fechar:hover { color: #dc2626; }
  .btn-fechar .material-symbols-outlined { font-size: 34px; }

  @media (max-width: 1000px) {
    .colegas-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 900px) {
    body { overflow: auto; align-items: flex-start; }
    .container { flex-direction: column; min-height: auto; }
    .sidebar { width: 100%; }
    .main { padding: 30px; }
    .colegas-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </li>
          <li class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Sala de Aula
          </li>
          <li>
            <a href="../Meus_Simulados_Professor/Meus_Simulados.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6M5 6h14v16H5z"/></svg>
              Meus Simulados
            </a>
          </li>
          <li>
            <a href="../Banco_Questões_Professor/Tela_Banco_Professor.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Banco de Questões
            </a>
          </li>
          <li>
            <a href="../5ConfiguracoesProf/ConfiguracoesProf.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Configurações
            </a>
          </li>
        </ul>
      </div>

      <div class="user">
        <div class="avatar" id="avatarInicial">P</div>
        <div class="info">
          <b id="nomeProfessor"></b>
          <span>Professor(a)</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <a class="voltar" href="Turmas.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar para Minhas Turmas
      </a>

      <div class="turma-header">
        <div>
          <h2 id="nomeTurmaTitulo">Carregando...</h2>
          <div class="meta">
            <span><div class="dot"></div><span id="quantidadeAlunos">0 alunos</span></span>
            <span><div class="dot"></div><span id="disciplinaTurma">Disciplina</span></span>
          </div>
        </div>
        <div class="codigo-pill" id="codigoTurma">Código: ----</div>
      </div>

      <h2 class="section-title">Alunos da Turma</h2>
      <div class="colegas-panel">
        <div class="colegas-grid" id="alunosGrade"></div>
      </div>
      <button class="btn-fechar" type="button" onclick="voltarLogin()"><span class="material-symbols-outlined">close</span></button>

    </main>
  </div>

  <script src="Turma_Professor.js"></script>
</body>
</html>
