<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Turmas - Classifica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 90vh;
  }
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .brand h1 { font-size: 28px; font-weight: 700; }

  .nav { list-style: none; }
  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }
  .nav li a {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; width: 100%;
  }
  .nav li:hover { background: rgba(255,255,255,0.12); }
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  .main {
    flex: 1;
    padding: 60px 70px;
    overflow-y: auto;
    position: relative;
  }

  .main h2 {
    font-size: 36px;
    color: #2c3e50;
    margin-bottom: 12px;
  }

  .divider {
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg,#3aa4e8,#3ec98a);
    margin-bottom: 40px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 36px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.05);
  }

  .card-info h3 {
    font-size: 24px;
    color: #2c3e50;
    margin-bottom: 10px;
  }

  .card-info .meta {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    color: #4a5568;
  }

  .card-info .meta span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 10px;
    height: 10px;
    background: #3ec98a;
    border-radius: 50%;
  }

  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg,#3aa4e8,#3ec98a);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { opacity: .9; }

  .add-row { display: flex; }

  .add-card {
    width: 90px;
    height: 90px;
    background: #fff;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.06);
    color: #3aa4e8;
    transition: transform .2s;
  }
  .add-card svg { width: 40px; height: 40px; }
  .add-card:hover { transform: translateY(-2px); }

  .estado-vazio,
  .estado-erro,
  .estado-carregando {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    color: #4a5568;
    font-size: 17px;
    margin-bottom: 24px;
  }
  .estado-erro { color: #c0392b; }

  .btn-fechar {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
  }
  .btn-fechar:hover { color: #dc2626; }
  .btn-fechar .material-symbols-outlined { font-size: 34px; }

  @media (max-width: 900px) {
    body { overflow: auto; align-items: flex-start; }
    .container { flex-direction: column; min-height: auto; }
    .sidebar { width: 100%; }
    .main { padding: 30px; }
  }
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </li>
          <li class="active">
            <a href="#" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px; width: 100%; height: 100%;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Sala de Aula
            </a>
          </li>
          <li>
            <a href="../Meus_Simulados_Professor/Meus_Simulados.html" style="display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; width:100%;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6M5 6h14v16H5z"/></svg>
              Meus Simulados
            </a>
          </li>
          <li>
            <a href="../Banco_Questões_Professor/Tela_Banco_Professor.html" style="display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; width:100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Banco de Questões
            </a>
          </li>
          <li>
            <a href="../5ConfiguracoesProf/ConfiguracoesProf.html" style="display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; width:100%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Configurações
            </a>
          </li>
        </ul>
      </div>

      <div class="user">
        <div class="avatar" id="avatarInicial">?</div>
        <div class="info">
          <b id="nomeProfessor"></b>
          <span>Professor(a)</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <h2>Minhas Turmas</h2>
      <div class="divider"></div>

      <div id="listaTurmas">
        <div class="estado-carregando">
          Carregando suas turmas...
        </div>
      </div>

      <div class="add-row">
        <div class="add-card" onclick="irParaCodigoSala()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
      </div>

    </main>
        <button class="btn-fechar" type="button" onclick="voltarLogin()"><span class="material-symbols-outlined">close</span></button>

  </div>

<script>
  const idProfessor = localStorage.getItem("idProfessor");

  async function buscarJSON(url) {
    const resposta = await fetch(url);
    if (!resposta.ok) {
      throw new Error(await resposta.text());
    }
    return resposta.json();
  }

  async function carregarProfessor() {
    if (!idProfessor) return;
    try {
      const professor = await buscarJSON(`/api/professor/${idProfessor}`);
      document.getElementById("nomeProfessor").textContent = professor.nome;
      document.getElementById("avatarInicial").textContent = professor.nome.charAt(0).toUpperCase();
    } catch (erro) {
      console.error(erro);
    }
  }

  async function carregarTurmas() {
    const lista = document.getElementById("listaTurmas");
    try {
      const turmas = await buscarJSON(`/api/turmasProfessor/${idProfessor}`);

      if (turmas.length === 0) {
        lista.innerHTML = `
          <div class="estado-vazio">
            Você ainda não possui nenhuma turma cadastrada.
          </div>
        `;
        return;
      }

      lista.innerHTML = "";

      turmas.forEach(turma => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-info">
            <h3></h3>
            <div class="meta">
              <span><div class="dot"></div><span class="codigo-turma"></span></span>
            </div>
          </div>
          <button class="btn">Acessar Turma</button>
        `;
        card.querySelector("h3").textContent = turma.nome;
        card.querySelector(".codigo-turma").textContent = `Código: ${turma.codigo}`;
        card.querySelector(".btn").addEventListener("click", () => acessarTurma(turma.idturma));
        lista.appendChild(card);
      });

    } catch (erro) {
      console.error(erro);
      lista.innerHTML = `<div class="estado-erro">Erro ao carregar as turmas.</div>`;
    }
  }

  function acessarTurma(idTurma) {
    localStorage.setItem("idTurma", idTurma);
    window.location.href = "../8SalaDeAulaProfessor/SalaAulaProfessor.html";
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (!idProfessor) {
      alert("Professor não autenticado.");
      window.location.href = "../4LoginProfessor/LoginProfessor.html";
      return;
    }
    carregarProfessor();
    carregarTurmas();
  });

  function irParaCodigoSala() {
    window.location.href = "../7CodigoSala/CodigoSalaProf.html";
  }

  window.voltarLogin = function () {
    window.location.href = "../4LoginProfessor/LoginProfessor.html";
  };
</script>
</body>
</html>
