<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salas de Aula - Classifica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #eef1f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1600px;
      background: #f5f1e8;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      min-height: 90vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
      color: #fff;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand { text-align: center; margin-bottom: 40px; }
    .brand .badge {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: inline-flex;
      align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .brand h1 { font-size: 28px; font-weight: 700; }

    .nav { list-style: none; }
    .nav li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin-bottom: 8px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background .2s;
    }
    .nav li:hover { background: rgba(255,255,255,0.12); }
    .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
    .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 30px;
    }
    .user .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #fff;
      color: #3aa4e8;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 20px;
    }
    .user .info { line-height: 1.3; }
    .user .info b { display: block; font-size: 15px; }
    .user .info span { font-size: 13px; opacity: 0.9; }

    /* Main Content */
    .main {
      flex: 1;
      padding: 60px 70px;
      display: flex;
      flex-direction: column;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .header-content h2 {
      font-size: 28px;
      color: #2c3e50;
    }

    /* Botão de Adicionar Nova Sala (+) */
    .btn-add-room {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3aa4e8, #3ec98a);
      color: white;
      font-size: 32px;
      font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(58, 164, 232, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-add-room:hover { transform: scale(1.08); opacity: 0.95; }

    /* Grid de Salas de Aula */
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .room-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .room-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .room-title { font-size: 20px; color: #2c3e50; font-weight: 700; margin-bottom: 8px; }
    .room-teacher { font-size: 15px; color: #7f8c8d; margin-bottom: 20px; }

    .btn-enter {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #eef1f5;
      color: #2c3e50;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-enter:hover { background: #3aa4e8; color: #fff; }

    /* Modal para Inserir Código */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-card h3 { color: #2c3e50; margin-bottom: 12px; }
    .modal-card p { color: #7f8c8d; font-size: 14px; margin-bottom: 24px; }

    /* Campos de Input do Código */
    .code-input-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .code-input-wrapper input {
      width: 42px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border: 1px solid #dcdfe4;
      border-radius: 8px;
      outline: none;
    }
    .code-input-wrapper input:focus { border-color: #3aa4e8; }

    .modal-actions { display: flex; gap: 10px; }
    .btn-confirm {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      background: linear-gradient(90deg, #3aa4e8, #3ec98a);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    .btn-cancel {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      background: #eef1f5; color: #7f8c8d; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>
            </svg>
          </div>
          <h1>Classifica</h1>
        </div>

        <ul class="nav">
          <li>Dashboard</li>
          <li class="active">Sala de Aula</li>
          <li>Questões</li>
          <li>Desempenho</li>
          <li>Configurações</li>
        </ul>
      </div>

      <div class="user">
        <div class="avatar">L</div>
        <div class="info">
          <b id="nomeUsuario">Aluno</b>
          <span>Estudante</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="header-content">
        <h2>Minhas Salas de Aula</h2>
        <button class="btn-add-room" id="btnAbrirModal" title="Entrar em uma nova sala">+</button>
      </div>

      <div class="rooms-grid" id="roomsContainer">
        <div class="room-card">
          <div>
            <div class="room-title" id="disciplina">Disciplina</div>
            <div class="room-teacher" id="professor">Professor</div>
          </div>
          <button class="btn-enter">Entrar na Sala</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalCodigo">
    <div class="modal-card">
      <h3>Entrar na Sala</h3>
      <p>Digite o código de 6 dígitos fornecido pelo seu professor:</p>

      <div class="code-input-wrapper">
        <input type="text" maxlength="1" />
        <input type="text" maxlength="1" />
        <input type="text" maxlength="1" />
        <input type="text" maxlength="1" />
        <input type="text" maxlength="1" />
        <input type="text" maxlength="1" />
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="btnFecharModal">Cancelar</button>
        <button class="btn-confirm" id="btnConfirmarCodigo">Entrar</button>
      </div>
    </div>
  </div>




  <script>
    var modal = document.getElementById('modalCodigo');
    var btnAbrir = document.getElementById('btnAbrirModal');
    var btnFechar = document.getElementById('btnFecharModal');
    var btnConfirmar = document.getElementById('btnConfirmarCodigo');
    var inputs = document.querySelectorAll('.code-input-wrapper input');

    // Controla abertura e fechamento do modal
    btnAbrir.onclick = function() { modal.style.display = 'flex'; };
    btnFechar.onclick = function() { modal.style.display = 'none'; };

    // Pular automaticamente para o próximo campo de input ao digitar
    for (var i = 0; i < inputs.length; i++) {
      (function(index) {
        inputs[index].addEventListener('input', function() {
          if (this.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });
      })(i);
    }

    // Pega o código digitado estilo tradicional/arcaico
    function obterCodigoFormatado() {
      var codigo = "";
      for (var i = 0; i < inputs.length; i++) {
        codigo = codigo + inputs[i].value;
      }
      return codigo;
    }

    // Ação ao clicar em confirmar no modal
    btnConfirmar.onclick = function() {
      var codigo = obterCodigoFormatado();

      if (codigo.length === 6) {
        alert("Entrando na sala com o código: " + codigo);
        modal.style.display = 'none';
        // Aqui você pode fazer o fetch para salvar o aluno na nova sala
      } else {
        alert("Por favor, preencha o código de 6 dígitos completo!");
      }
    };
  </script>
</body>
</html>
