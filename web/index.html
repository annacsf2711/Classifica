<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avaliação Diagnóstica - Exemplo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    fieldset { border: 1px solid #ccc; padding: 10px; }
    legend { font-weight: bold; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Avaliação Diagnóstica - Exemplo (arquivo estático de referência)</h1>
  <p>Interface dinâmica: este HTML consome a API Java em <code>/api/questions</code> e envia para <code>/api/submit</code>.</p>
  <div id="app">
    <p>Carregando perguntas...</p>
  </div>

  <script>
    // Busca perguntas e monta formulário dinamicamente
    async function loadQuestions() {
      const res = await fetch('/api/questions');
      const questions = await res.json();
      const app = document.getElementById('app');
      const form = document.createElement('form');
      form.addEventListener('submit', onSubmit);

      questions.forEach(q => {
        const field = document.createElement('fieldset');
        const legend = document.createElement('legend');
        legend.textContent = q.text;
        field.appendChild(legend);
        q.options.forEach((opt, idx) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'q' + q.id;
          input.value = idx;
          label.appendChild(input);
          label.appendChild(document.createTextNode(' ' + opt));
          field.appendChild(label);
          field.appendChild(document.createElement('br'));
        });
        form.appendChild(field);
      });

      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Enviar';
      form.appendChild(btn);

      app.innerHTML = '';
      app.appendChild(form);
    }

    // Envia respostas via form-urlencoded para /api/submit e mostra resultado
    async function onSubmit(ev) {
      ev.preventDefault();
      const form = ev.target;
      const data = new URLSearchParams(new FormData(form));
      const res = await fetch('/api/submit', { method: 'POST', body: data });
      const result = await res.json();
      showResult(result);
    }

    function showResult(result) {
      const app = document.getElementById('app');
      const div = document.createElement('div');
      div.innerHTML = `<h2>Resultado: ${result.score} / ${result.total}</h2>`;
      const ul = document.createElement('ul');
      result.details.forEach(d => {
        const li = document.createElement('li');
        li.innerHTML = `${escapeHtml(d.question)} — sua resposta: ${escapeHtml(d.selectedText || '(não respondida)')} ${d.correct ? '<strong>(correta)</strong>' : '<em>(incorreta)</em>'}`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
      div.appendChild(document.createElement('p'));
      const again = document.createElement('a');
      again.href = '/';
      again.textContent = 'Fazer novamente';
      div.appendChild(again);
      app.innerHTML = '';
      app.appendChild(div);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    loadQuestions().catch(err => {
      document.getElementById('app').textContent = 'Erro ao carregar perguntas.';
      console.error(err);
    });
  </script>
</body>
</html>
