<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classifica - Sala de Aula</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .container {
    display: flex;
    width: 100%;
    max-width: 1600px;
    height: 90vh;
    background: #f5f1e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    height: 100%;
    background: linear-gradient(180deg, #3aa4e8 0%, #3ec98a 100%);
    color: #fff;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .brand { text-align: center; margin-bottom: 40px; }
  .brand .badge {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 12px;
  }

  .brand h1 { font-size: 28px; font-weight: 700; }

  .nav { list-style: none; }

  .nav li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }

  .nav li:hover { background: rgba(255,255,255,0.12); }
  .nav li.active { background: rgba(255,255,255,0.22); font-weight: 600; }
  .nav li svg { width: 22px; height: 22px; flex-shrink: 0; }
  .nav li a {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    width: 100%;
  }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border-radius: 30px;
  }
  .user .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    color: #3aa4e8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .user .info { line-height: 1.3; }
  .user .info b { display: block; font-size: 15px; }
  .user .info span { font-size: 13px; opacity: 0.9; }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    min-height: 0;
    padding: 50px 60px;
    background: #f5f1e8;
    overflow-y: auto;
  }

  :root {
    --blue: #3aa4e8;
    --green: #3ec98a;
    --card-bg: #ffffff;
    --text-dark: #1f2733;
    --text-muted: #7c8698;
    --border: #eaedf3;
    --pill-bg: #e7ecff;
    --pill-text: #4a5cff;
  }

  .greeting h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .greeting p {
    color: var(--text-muted);
    font-size: 14px;
  }

  h2.section-title {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 30px 0 16px;
  }

  /* DISCIPLINAS */
  .disciplinas-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .disciplina-card {
  position: relative;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(20, 30, 60, 0.06);
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
}

.disciplina-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 5px;
  background: var(--accent, #3aa4e8);
}

.disciplina-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 24px rgba(20, 30, 60, 0.12);
}

.disciplina-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.disciplina-card h3 {
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-dark);
}

.disciplina-card .prof {
  font-size: 12.5px;
  color: var(--text-muted);
}

.disciplina-card .ver-mais {
  margin-top: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent, #3aa4e8);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* cores por disciplina */
.disciplina-card[data-disciplina="Matemática"] { --accent: #3aa4e8; }
.disciplina-card[data-disciplina="Português"] { --accent: #3ec98a; }
.disciplina-card[data-disciplina="Ciências da Natureza"] { --accent: #8b5cf6; }
.disciplina-card[data-disciplina="Ciências Humanas"] { --accent: #f27128; }

.icon-matematica { background: #e7f1fd; }
.icon-portugues { background: #e5f7ee; }
.icon-natureza { background: #f2ebfd; }
.icon-humanas { background: #fdece4; }
.disciplina-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(20,30,60,0.08);
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 30, 0.55);
  backdrop-filter: blur(2px);
  align-items: center;
  justify-content: center;
  z-index: 999;
  animation: fadeIn .2s ease;
}
.modal-overlay.ativo { display: flex; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  background: #fff;
  width: 92%;
  max-width: 520px;
  max-height: 82vh;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: slideUp .25s ease;
}

@keyframes slideUp {
  from { transform: translateY(24px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 26px;
  background: linear-gradient(135deg, var(--modal-accent, #3aa4e8), var(--modal-accent-2, #3ec98a));
  color: #fff;
}

.modal-header-text h3 {
  font-size: 18px;
  font-weight: 700;
}
.modal-header-text span {
  font-size: 12.5px;
  opacity: 0.9;
}

.modal-close {
  background: rgba(255,255,255,0.2);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: rgba(255,255,255,0.35); }

.modal-body {
  padding: 20px 26px 26px;
  overflow-y: auto;
  background: #fafbfc;
}

.simulado-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 12px;
  transition: box-shadow .15s ease, transform .15s ease;
}
.simulado-item:hover {
  box-shadow: 0 4px 14px rgba(20,30,60,0.08);
  transform: translateY(-2px);
}
.simulado-item:last-child { margin-bottom: 0; }

.simulado-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--pill-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-right: 14px;
}

.simulado-info { flex: 1; }
.simulado-info b { display: block; font-size: 14.5px; color: var(--text-dark); }
.simulado-info span { font-size: 12px; color: var(--text-muted); }

.simulado-btn {
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  background: var(--modal-accent, #3aa4e8);
  border: none;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
}
.simulado-btn:hover { opacity: 0.85; }

.modal-vazio {
  text-align: center;
  padding: 40px 10px;
  color: var(--text-muted);
}
.modal-vazio svg {
  width: 48px; height: 48px;
  margin-bottom: 12px;
  opacity: 0.4;
}

  /* COLEGAS */
  .colegas-panel {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 28px 30px;
    box-shadow: 0 4px 18px rgba(20, 30, 60, 0.06);
    margin-top: 4px;
  }

  .colegas-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px 18px;
    margin-top: 18px;
  }

  .colega-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }

  .colega-avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #eef1f6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b7bfcc;
  }

  .colega-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
  }

  .colega-btn {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--pill-text);
    background: var(--pill-bg);
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .colega-btn:hover {
    background: #d7deff;
  }
  .btn-fechar{
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
  }

  .btn-fechar:hover{
      color: #dc2626;
  }

  .btn-fechar .material-symbols-outlined{
      font-size: 34px;
  }

  @media (max-width: 1000px) {
    .disciplinas-grid { grid-template-columns: repeat(2, 1fr); }
    .colegas-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 900px) {
    body { overflow: auto; align-items: flex-start; }
    .container { flex-direction: column; height: auto; min-height: 90vh; }
    .sidebar { width: 100%; height: auto; }
    .main { padding: 30px; overflow-y: visible; }
    .disciplinas-grid { grid-template-columns: 1fr; }
    .colegas-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

    <div>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <polygon points="12 2 15 8.5 22 9.3 17 14 18.2 21 12 17.8 5.8 21 7 14 2 9.3 9 8.5 12 2"/>

      </ul>
    </div>

    <div class="user">
      <div class="avatar" id="avatarInicial">?</div>

        <b id="nomeUsuario"></b>
        <span>Estudante</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="greeting">
      <h1>Olá Estudante!</h1>
      <p>Vamos juntos rumo à sua aprovação!</p>

    <h2 class="section-title">Suas Disciplinas</h2>

  <!-- Modal de Simulados -->
<div class="modal-overlay" id="modalSimulados">
  <div class="modal-box">
    <div class="modal-header" id="modalHeader">
      <div class="modal-header-text">
        <h3 id="modalDisciplinaTitulo">Simulados</h3>
        <span id="modalSubtitulo">Escolha um para responder</span>
      </div>
      <button class="modal-close" id="fecharModal">&times;</button>
    </div>
    <div class="modal-body" id="listaSimulados"></div>
  </div>
</div>
